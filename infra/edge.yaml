AWSTemplateFormatVersion: '2010-09-09'
Description: The certificate, the site bucket and the CloudFront distribution of redlamp.me. The stack is in us-east-1.

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The zone redlamp.me of the stack redlamp-dns.
  FunctionUrl:
    Type: String
    Description: The function URL of the stack redlamp-api in eu-central-1.

Resources:
  # CloudFront takes a certificate only from us-east-1, so this stack is in that region.
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html#https-requirements-aws-region
  # ACM makes one validation record for each of the two names.
  # https://docs.aws.amazon.com/acm/latest/userguide/dns-validation.html
  # With HostedZoneId, ACM adds its validation record to the zone.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-certificatemanager-certificate-domainvalidationoption.html#cfn-certificatemanager-certificate-domainvalidationoption-hostedzoneid
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: redlamp.me
      SubjectAlternativeNames:
        - www.redlamp.me
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: redlamp.me
          HostedZoneId: !Ref HostedZoneId
        - DomainName: www.redlamp.me
          HostedZoneId: !Ref HostedZoneId

  # By default, new buckets allow no public access and encrypt new objects.
  # https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
  # https://docs.aws.amazon.com/AmazonS3/latest/userguide/default-bucket-encryption.html
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub redlamp-site-${AWS::AccountId}

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  SiteAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: redlamp-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront signs each request to the function URL. For a POST or a PUT, the browser must send the SHA-256 of the body in the header x-amz-content-sha256.
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-lambda.html
  NotebookAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: redlamp-notebook
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # The function sends a request for www.redlamp.me to redlamp.me. On the public site, a path that ends with a slash gets index.html, and a path without a dot gets the extension .html.
  # rawQueryString gives the query string as the viewer sent it.
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/general-helper-methods.html#raw-query-string-method
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: redlamp-viewer-request
      AutoPublish: true
      FunctionConfig:
        Comment: Redirects www to the apex and maps public site paths to files
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        async function handler(event) {
          var request = event.request;
          if (request.headers.host.value === 'www.redlamp.me') {
            var query = request.rawQueryString();
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: { location: { value: 'https://redlamp.me' + request.uri + (query ? '?' + query : '') } }
            };
          }
          var uri = request.uri;
          if (uri === '/leetcode' || uri.startsWith('/leetcode/')) {
            return request;
          }
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.includes('.')) {
            request.uri += '.html';
          }
          return request;
        }

  # CloudFront adds the header to the viewer response only. The header does not change the time that CloudFront keeps an asset.
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/modifying-response-headers.html
  AssetsHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: redlamp-assets
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: public, max-age=0, must-revalidate
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - redlamp.me
          - www.redlamp.me
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # The domain name of the origin is the host of the function URL.
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistS3AndCustomOrigins.html#concept_lambda_function_url
          - Id: notebook
            DomainName: !Select [2, !Split ['/', !Ref FunctionUrl]]
            OriginAccessControlId: !GetAtt NotebookAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        # The managed cache policy CachingOptimized.
        # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#managed-cache-caching-optimized
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
        # CloudFront uses the first behavior whose pattern matches, so the assets come before the notebook.
        # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesCacheBehavior.html#DownloadDistValuesPathPattern
        CacheBehaviors:
          - PathPattern: /leetcode/assets/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref AssetsHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN
          # The pattern matches /leetcode, /leetcode.html and /leetcode/*. The server answers 404 for each other path.
          # The managed cache policy CachingDisabled.
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#managed-cache-policy-caching-disabled
          # The managed origin request policy AllViewerExceptHostHeader sends the cookies, the query string and the viewer headers but not Host. It also sends the viewer location headers of CloudFront.
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-origin-request-policies.html#managed-origin-request-policy-all-viewer-except-host-header
          # CloudFront-Viewer-Address is a viewer location header.
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html#cloudfront-headers-viewer-location
          - PathPattern: /leetcode*
            TargetOriginId: notebook
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerRequestFunction.FunctionARN

  # Z2FDTNDATAQYW2 is the hosted zone ID of every CloudFront alias target.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-route53-recordset-aliastarget.html#cfn-route53-recordset-aliastarget-hostedzoneid
  Records:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: redlamp.me
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: redlamp.me
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: www.redlamp.me
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: www.redlamp.me
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
