version: 0.2

env:
  variables:
    TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable

phases:
  install:
    runtime-versions:
      golang: 1.27
      nodejs: 26
    commands:
      - npm install --global bun@1.4.4
      - bun install --frozen-lockfile
  pre_build:
    commands:
      # Aurora DSQL uses UTF-8 and the C collation only, so text sorts in the same order in the tests.
      # https://docs.aws.amazon.com/aurora-dsql/latest/userguide/working-with-postgresql-compatibility-migration-guide.html
      - docker run --detach --name postgres --publish 5432:5432 --env POSTGRES_PASSWORD=test --env POSTGRES_INITDB_ARGS='--encoding=UTF8 --locale=C' public.ecr.aws/docker/library/postgres:16.16
      - until docker exec postgres pg_isready --username postgres; do sleep 1; done
  build:
    commands:
      - cd backend
      - go vet ./...
      - go test ./...
      # The Deploy action runs this binary on the same image.
      - go build -o ../build/migrate ./cmd/migrate
      - cd ..
      - bun run lint
      - bun run typecheck
      # The script also builds the web assets in dist/.
      - bun run test
      - cd infra
      - sam build --build-dir ../build/sam
      - cd ..

artifacts:
  files:
    - build/**/*
    - dist/**/*
    - infra/*
