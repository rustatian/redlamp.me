version: 0.2

phases:
  build:
    commands:
      # The artifact of the Build action is a ZIP file. The two binaries must be executable after it.
      - chmod +x build/migrate build/sam/ApiFunction/bootstrap
      # The functions and their calls are one command, so they run in one shell process. set -e stops the command at the first line that fails, and a failed read of a stack output is such a line.
      - |
        set -e
        # output prints one output value of a stack. The arguments are the region, the stack and the output key.
        output() { aws cloudformation describe-stacks --region "$1" --stack-name "$2" --query "Stacks[0].Outputs[?OutputKey=='$3'].OutputValue" --output text; }
        # A deploy of a stack with no change leaves a change set with the status FAILED. clean deletes these change sets of a stack.
        # https://github.com/aws/aws-cli/issues/4534
        clean() { for id in $(aws cloudformation list-change-sets --region "$1" --stack-name "$2" --query "Summaries[?Status=='FAILED'].ChangeSetId" --output text); do aws cloudformation delete-change-set --region "$1" --change-set-name "$id"; done; }
        clean us-east-1 redlamp-dns
        clean eu-central-1 redlamp-data
        clean eu-central-1 redlamp-api
        clean us-east-1 redlamp-edge
        aws cloudformation deploy --region us-east-1 --stack-name redlamp-dns --template-file infra/dns.yaml --role-arn "$CLOUDFORMATION_ROLE" --no-fail-on-empty-changeset
        aws cloudformation deploy --region eu-central-1 --stack-name redlamp-data --template-file infra/data.yaml --role-arn "$CLOUDFORMATION_ROLE" --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
        endpoint=$(output eu-central-1 redlamp-data ClusterEndpoint)
        cluster=$(output eu-central-1 redlamp-data ClusterArn)
        role=$(output eu-central-1 redlamp-api FunctionRoleArn)
        # The migrations run before the new code. The role mapping gives the database role app its rights on new tables.
        build/migrate -endpoint "$endpoint" -app-role-arn "$role"
        distribution=$(output us-east-1 redlamp-edge DistributionId)
        sam deploy --region eu-central-1 --stack-name redlamp-api --template-file build/sam/template.yaml --s3-bucket "$ARTIFACT_BUCKET" --s3-prefix sam --role-arn "$CLOUDFORMATION_ROLE" --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "ClusterEndpoint=$endpoint" "ClusterArn=$cluster" "DistributionId=$distribution"
        zone=$(output us-east-1 redlamp-dns HostedZoneId)
        url=$(output eu-central-1 redlamp-api FunctionUrl)
        aws cloudformation deploy --region us-east-1 --stack-name redlamp-edge --template-file infra/edge.yaml --role-arn "$CLOUDFORMATION_ROLE" --no-fail-on-empty-changeset --parameter-overrides "HostedZoneId=$zone" "FunctionUrl=$url"
        bucket=$(output us-east-1 redlamp-edge BucketName)
        distribution=$(output us-east-1 redlamp-edge DistributionId)
        aws s3 sync dist "s3://$bucket" --delete
        aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*'
