name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    # The image has Node 24.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm install --global bun@1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  browser:
    runs-on: ubuntu-24.04
    # The image has Node 24 and Chromium; --init reaps the server processes that the tests stop.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init
    timeout-minutes: 60
    # Each browser test starts the Go server with its own schema in PostgreSQL 16.
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A job in a container reaches a service by the name of the service.
      # https://docs.github.com/en/actions/tutorials/use-containerized-services/use-docker-service-containers
      TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm install --global bun@1.4.4
      - run: bun install --frozen-lockfile
      # The cases "homework navigation with Noto Sans" need this font, and the image does not have it.
      - run: apt-get update && apt-get install --yes --no-install-recommends fonts-noto-core
      - run: bun run test:browser
