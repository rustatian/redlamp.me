name: Backend

on:
  push:
    paths:
      - backend/**
      - shared/answers.cases.json
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - shared/answers.cases.json
      - .github/workflows/backend.yml

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # The database tests run against PostgreSQL 16, the version that Aurora DSQL is compatible with.
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_PASSWORD: test
          # Aurora DSQL uses UTF-8 and the C collation only, so text sorts in the same order in the tests.
          # https://docs.aws.amazon.com/aurora-dsql/latest/userguide/working-with-postgresql-compatibility-migration-guide.html
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
